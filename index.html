<style>
:root{
  /* Type scale (pt): 11 caption · 13 footnote · 15 subhead · 17 body · 22 title2 · 28 title1 · 34 large title · 48 display
     Spacing: 8pt grid → 4 · 8 · 12 · 16 · 24 · 32 */
  --bg:#000;--s1:#1c1c1e;--s2:#2c2c2e;--s3:#3a3a3c;--sep:rgba(84,84,88,.5);
  --t1:#fff;--t2:rgba(235,235,245,.6);--t3:rgba(235,235,245,.3);
  --accent:#0A84FF;--warn:#FF9F0A;
  --seg-bg:rgba(118,118,128,.24);--seg-on:#636366;--seg-sh:none;--nav:rgba(18,18,18,.82);--nav-t:#8e8e93;
  --toast:rgba(58,58,60,.96);--on-t1:#000;--scrim:rgba(0,0,0,.55);--panel:#1c1c1e;--pc:#2c2c2e;--pstep:#3a3a3c;
  --a15:rgba(10,132,255,.15);--w15:rgba(255,159,10,.15);color-scheme:dark;
}
/* ライトモード（iOSのシステムカラーに準拠） */
:root[data-theme="light"]{
  --bg:#F2F2F7;--s1:#FFFFFF;--s2:#F2F2F7;--s3:#E5E5EA;--sep:rgba(60,60,67,.18);
  --t1:#000000;--t2:rgba(60,60,67,.6);--t3:rgba(60,60,67,.28);
  --accent:#007AFF;--warn:#FF9500;
  --seg-bg:rgba(118,118,128,.12);--seg-on:#FFFFFF;--seg-sh:0 1px 3px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);--nav:rgba(249,249,249,.9);--nav-t:#8e8e93;
  --toast:rgba(255,255,255,.97);--on-t1:#fff;--scrim:rgba(0,0,0,.3);--panel:#F2F2F7;--pc:#FFFFFF;--pstep:#EFEFF4;
  --a15:rgba(0,122,255,.1);--w15:rgba(255,149,0,.12);color-scheme:light;
}
:root[data-theme="light"] .card,:root[data-theme="light"] .group,:root[data-theme="light"] .pcard,:root[data-theme="light"] .tile{box-shadow:0 1px 2px rgba(0,0,0,.04)}
:root[data-theme="light"] .toast{box-shadow:0 8px 24px rgba(0,0,0,.12)}
:root[data-theme="light"] .tile.on{box-shadow:inset 0 0 0 2px var(--accent)}
:root[data-theme="light"] .logo{box-shadow:0 12px 32px rgba(0,122,255,.25)}
body,.card,.group,.pcard,.tile,nav.tb{transition:background-color .25s ease,color .25s ease}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:17px;line-height:1.35;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--t1);background:var(--s2);border:0;border-radius:10px;outline:none;color-scheme:dark}
input:focus{box-shadow:0 0 0 2px var(--accent)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
main{max-width:560px;margin:0 auto;padding:0 16px}
.tab{display:none}.tab.on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.lt{display:flex;justify-content:space-between;align-items:flex-end;padding:calc(16px + env(safe-area-inset-top)) 0 16px}
.lt .date{font-size:13px;color:var(--t2);font-weight:600;letter-spacing:.02em}
.lt h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.back{color:var(--accent);font-size:17px;display:flex;align-items:center;gap:4px;margin-bottom:4px}
.back svg{width:20px;height:20px;stroke-width:2.5}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--s1);display:grid;place-items:center;color:var(--t2)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.card{background:var(--s1);border-radius:16px;padding:16px}
.card+.card{margin-top:12px}
.sec{font-size:13px;color:var(--t2);margin:24px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec b{color:var(--t1);font-weight:600;font-size:15px}
.group{background:var(--s1);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:12px 16px;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;transform:scaleY(.5);background:var(--sep)}
button.row:active,.row.tap:active{background:var(--s2)}
.grow{flex:1;min-width:0}
.t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--t2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.chev{color:var(--t3);width:16px;height:16px}
.accent{color:var(--accent)}.warn{color:var(--warn)}.muted{color:var(--t2)}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:13px;color:var(--t2);font-weight:500}
.hero{font-size:48px;font-weight:700;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.hero small{font-size:17px;font-weight:500;color:var(--t2);letter-spacing:0;margin-left:8px}
.hero.m{font-size:34px}
.bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.over i{background:var(--warn)}
.bar.thin{height:4px;margin-top:8px}
.sub{font-size:13px;color:var(--t2);margin-top:8px}
.pfc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.pfc .pc{min-width:0}
.pfc .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.pfc .v small{font-size:13px;color:var(--t2);font-weight:500;margin-left:2px}
.pfc .tg{font-size:13px;color:var(--t2);margin-top:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kc{color:var(--t2);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.plus{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.plus svg{width:16px;height:16px;stroke-width:2.5}
.plus.sm{width:24px;height:24px}.plus.sm svg{width:14px;height:14px}
.x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--t3);flex:none}
.x svg{width:16px;height:16px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;margin-top:16px;transition:transform .1s,opacity .1s}
.btn:active{transform:scale(.98);opacity:.85}
.btn.ghost{background:var(--s1);color:var(--accent)}
.btn.plain{background:none;color:var(--accent);height:44px;margin-top:8px}
.btn.danger{background:var(--s1);color:var(--warn)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.big{font-size:28px;font-weight:700;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums}
.big small{font-size:15px;font-weight:500;color:var(--t2);margin:0 4px 0 4px;letter-spacing:0}
.big .x2{color:var(--t3);font-weight:400;margin:0 4px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:13px;font-weight:600;color:var(--t2);background:var(--s2);padding:4px 12px;border-radius:99px;white-space:nowrap}
.pill.a{color:var(--accent);background:var(--a15)}
.pill.w{color:var(--warn);background:var(--w15)}
.done-line{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;margin-top:8px}
.ck{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.ck svg{width:16px;height:16px;stroke-width:3}
.empty{text-align:center;padding:24px 12px}
.empty .muted{font-size:15px}

.srow{display:flex;align-items:center;gap:12px;padding:12px 0}
.srow+.srow{border-top:.5px solid var(--sep)}
.srow>span:first-child{flex:1;font-size:17px;min-width:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--s2);font-size:22px;line-height:1;color:var(--t1);display:grid;place-items:center}
.stepper button:active{background:var(--s3)}
.stepper input{width:80px;text-align:center;background:transparent;font-size:22px;font-weight:600;padding:8px 0;font-variant-numeric:tabular-nums}
.unit{width:30px;color:var(--t2);font-size:15px}

.seg{display:flex;background:var(--seg-bg);border-radius:9px;padding:4px;gap:4px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:15px;font-weight:500;color:var(--t1);transition:background .15s}
.seg button.on{background:var(--seg-on);box-shadow:var(--seg-sh);font-weight:600}
.field{margin-top:16px}
.field>.lbl{margin-bottom:8px}
.feas{font-size:13px;margin-top:12px}

.e1{text-align:center;padding:16px 0 4px}
.rmt{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.rmt div{text-align:center}
.rmt small{display:block;font-size:11px;color:var(--t2)}
.rmt b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
details summary{list-style:none;cursor:pointer;font-size:15px;color:var(--accent);text-align:center;margin-top:16px}
details summary::-webkit-details-marker{display:none}

.d{width:62px;font-size:13px;color:var(--t2);flex:none;font-variant-numeric:tabular-nums}
.row.today .d{color:var(--accent);font-weight:600}
.circ{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--t3);display:grid;place-items:center;flex:none;color:#fff}
.circ svg{width:14px;height:14px;stroke-width:3;opacity:0}
.circ.on{background:var(--accent);border-color:var(--accent)}
.circ.on svg{opacity:1}
.row.fin .t{color:var(--t2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:8px;vertical-align:2px}
.note{font-size:15px;color:var(--t2);margin-top:16px;padding-top:16px;border-top:.5px solid var(--sep)}

/* plan list */
.pcard{display:block;width:100%;text-align:left;background:var(--s1);border-radius:16px;padding:16px}
.pcard+.pcard{margin-top:12px}
.pcard:active{background:var(--s2)}
.pcard .h{display:flex;align-items:center;gap:8px}
.pcard .h .t{flex:1;font-weight:600}
.pcard .w{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.pcard .w small{font-size:15px;color:var(--t2);font-weight:500;margin-left:4px}

/* calendar */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--s1);border-radius:14px;padding:12px 12px;text-align:left;min-width:0}
.tile .n{font-size:13px;color:var(--t2)}
.tile .v{font-size:17px;white-space:nowrap;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.tile.on{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-h b{font-size:17px;font-weight:600}
.cal-h .nav{display:flex;gap:4px}
.cal-h .nav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;text-align:center}
.cal .wd{font-size:11px;color:var(--t2);padding-bottom:4px}
.cd{position:relative;height:40px;display:grid;place-items:center}
.cd span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.cd.has span{background:var(--accent);color:#fff;font-weight:600}
.cd.today span{box-shadow:inset 0 0 0 1.5px var(--t1)}
.cd.sel:not(.has) span{background:var(--s3)}
.cd.sel.has span{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.cd.plan::after{content:"";position:absolute;bottom:0;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--t2)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--t2);margin-top:12px;justify-content:center}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:4px;vertical-align:0}
.legend i.p{background:var(--t2);width:5px;height:5px;vertical-align:1px}

/* refs */
.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ref{background:var(--s2);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s}
.ref.on{box-shadow:inset 0 0 0 2px var(--accent)}
.ref .n{font-size:13px;color:var(--t2);font-weight:600}
.ref .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.ref .u{font-size:11px;color:var(--t2)}
.ref .d2{font-size:11px;color:var(--t2);margin-top:8px;font-variant-numeric:tabular-nums}

#chart svg{width:100%;height:auto;display:block}

<script>
/* ================= Utils ================= */
const $ = s => document.querySelector(s);
const KEY = 'wpo-data-v1';
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r1 = x => Math.round(x * 10) / 10;
const r25 = x => Math.round(x / 2.5) * 2.5;
const e1rm = (w, r) => r <= 1 ? w : w * (1 + r / 40);   // O'Conner
const fmtN = n => Number.isInteger(n) ? n.toLocaleString() : r1(n).toString();
const WD = '日月火水木金土';
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => key(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return key(d); };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);

function maintOf(b = S.body) { return r10(bmrOf(b) * PAL[b.act || 'mid'][1]); }

const fmtSet = (w, r, sets) => `${fmtN(+w)}kg × ${r}回${sets ? ` × ${sets}セット` : ''}`;
function setGroups(ls) {                                       // 同じ重量×回数をまとめる
  const g = [];
  ls.forEach(l => { const last = g[g.length - 1]; if (last && last.w === l.w && last.r === l.r) last.sets += l.sets; else g.push({ w: l.w, r: l.r, sets: l.sets }); });
  return g;
}
const setsSummary = ls => { const g = setGroups(ls); if (g.length === 1) return fmtSet(g[0].w, g[0].r, g[0].sets);
  const ws = g.map(x => x.w); return `${g.reduce((a, x) => a + x.sets, 0)}セット · ${fmtN(Math.min(...ws))}〜${fmtN(Math.max(...ws))}kg`; };
function burnOf(date) {
  const base = maintOf();
  const strength = S.logs.filter(l => l.date === date).reduce((a, l) => a + strengthKcal(l), 0);

const mealsToday = () => S.meals[today()] || (S.meals[today()] = []);
const sumOf = arr => arr.reduce((a, m) => ({ kcal: a.kcal + m.kcal, p: a.p + m.p, f: a.f + m.f, c: a.c + m.c }), { kcal: 0, p: 0, f: 0, c: 0 });

/* PFCセル：ラベル／値／目標／バー の4段固定。桁が増えても列の高さと位置がそろう */
function pfcCells(v, T) {

function balanceTone(bal) {
  const m = S.mode;

}
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(Math.round(n)).toLocaleString();

/* 1週間の集計：記録のある「終わった日」だけで目標との差を出し、残りの日で割って調整量にする */
function weekStats(off) {
  const td = today(), mon = addDays(monday(td), off * 7), eb = EB(), T = Math.round(S.targets.kcal);
  const days = [...Array(7)].map((_, i) => {
    const k = addDays(mon, i), ms = S.meals[k] || [], intake = Math.round(sumOf(ms).kcal), b = burnOf(k), ex = b.strength + b.cardio;
    return { k, logged: ms.length > 0, intake, burn: b.total, bal: intake - b.total, goal: Math.round(T + ex * eb - b.total), past: k < td, isToday: k === td };
  });
  const done = days.filter(d => d.logged && d.past), n = done.length;
  const sum = f => done.reduce((a, d) => a + d[f], 0);
  const bal = sum('bal'), goal = sum('goal'), diff = bal - goal;
  const rest = off === 0 ? days.filter(d => !d.past).length : 0;
  return { mon, sun: addDays(mon, 6), days, n, bal, goal, diff, rest, adj: rest && n ? -diff / rest : 0, T,
    avgIn: n ? sum('intake') / n : 0, avgOut: n ? sum('burn') / n : 0 };
}
/* 目標との差の良し悪し（減量なら多すぎ、増量なら少なすぎが要注意） */
function diffTone(diff) {
  const tol = 100;

  if (S.mode === 'bulk') return diff < -tol ? 'warn' : 'accent';

}
function balanceHero(sum, pfc) {

  return `<div class="card">${top}${balView === 'week' ? weekBody() : dayBody(sum) + `<div class="pfc">${pfc}</div>`}</div>`;
}
function dayBody(sum) {
  const b = burnOf(today()), intake = Math.round(sum.kcal), bal = intake - b.total, eb = EB();
  const target = Math.round(S.targets.kcal), ex = b.strength + b.cardio, exC = Math.round(ex * eb);

function weekBody() {

/* 7日分の「目標との差」棒グラフ（上＝多い、下＝少ない） */
function weekBars(w, md) {

function trainCards() {
  const td = today();
  if (!S.plans.length) return `<div class="card empty"><div class="muted">MAX更新のプランを作ると、<br>今日やるメニューがここに出ます</div><button class="btn" data-act="goPlan">プランを作る</button></div>`;
  const items = S.plans.flatMap(P => P.sessions.filter(s => s.date === td).map(s => ({ P, s })));
  if (!items.length) {
    // プランの種目は今日は予定なし（他の部位のトレは自由）。プランごとの次回だけ小さく出す
    const nexts = S.plans.filter(P => !isFinished(P)).map(P => ({ P, s: P.sessions.find(s => s.date > td && !s.done) })).filter(x => x.s).sort((a, b) => a.s.date < b.s.date ? -1 : 1);
    if (!nexts.length) return '';
    return `<div class="lbl" style="margin:0 4px 8px">プランの次回</div><div class="group">${nexts.map(({ P, s }) => `<button class="row" data-act="openPlanFromHome" data-id="${P.id}">
      <span class="d">${fmtD(s.date)}</span><div class="grow"><div class="t">${esc(P.ex)}</div><div class="s num">${s.max ? `MAX ${fmtN(s.w)}kg` : fmtSet(s.w, s.r, s.sets)} · ${kindLabel(s)}</div></div>${I.chev}</button>`).join('')}</div>`;
  }
  return items.map(({ P, s }) => {
    const left = diffDays(td, P.targetDate), cd = left > 0 ? `MAXまで ${left}日` : left === 0 ? 'MAX当日' : '';
    const top = `<div class="card-top"><span class="lbl">${esc(P.ex)}</span><span class="pill ${s.max ? 'w' : 'a'}">${s.max ? 'MAX挑戦' : (kindLabel(s) || PH[s.ph])}</span></div>`;
    if (s.done) {
      const a = s.actual || s;

/* ----- 食事 ----- */
function sinceLastMeal() {
  const ms = S.meals[today()] || []; if (!ms.length) return null;
  const last = ms.reduce((m, x) => x.t > m.t ? x : m, ms[0]);
  const [h, mi] = last.t.split(':').map(Number), now = new Date(), t = new Date(); t.setHours(h, mi, 0, 0);
  const min = Math.floor((now - t) / 60000); if (min < 0) return null;
  return { min, last, over: S.remind.on && min >= S.remind.min, txt: min < 60 ? `${min}分` : `${Math.floor(min / 60)}時間${min % 60 ? (min % 60) + '分' : ''}` };
}
function addMeal(p, slot, t, quiet) {
  t = t || nowHM();
  const m = { id: uid(), name: p.name, kcal: Math.round(num(p.kcal)), p: r1(num(p.p)), f: r1(num(p.f)), c: r1(num(p.c)), t, slot: slot || autoSlot(t) };
  mealsToday().push(m); save(); if (cur === 'home') renderHome();
  if (!quiet) toast(`${SLOTN[m.slot]} ${m.t} +${m.kcal} kcal`, () => { S.meals[today()] = mealsToday().filter(x => x.id !== m.id); save(); if (cur === 'home') renderHome(); });
  return m;
}
function recentFoods() {
  const seen = new Set(), out = [];
  Object.keys(S.meals).sort().reverse().forEach(d => S.meals[d].slice().reverse().forEach(m => { if (!seen.has(m.name) && out.length < 12) { seen.add(m.name); out.push(m); } }));
  return out;
}
const fs = { slot: 'b', q: '', item: null, res: [], t: '', added: [] };
const timeRow = (id, v) => `<label class="row trow"><span class="grow">食べた時刻</span><input type="time" id="${id}" value="${v}"></label>`;
function foodSheet(slot, keep) {

/* ----- インターバルタイマー ----- */
const RT = { end: 0, dur: 0, iv: null };
let actx = null;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep() {
  try { unlockAudio(); const t0 = actx.currentTime;
    [0, .25, .5].forEach(dt => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(.3, t0 + dt + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + dt + .18); o.start(t0 + dt); o.stop(t0 + dt + .2); });
  } catch (e) {}
}
const mmss = n => `${Math.floor(n / 60)}:${pad(n % 60)}`;
function startRest(sec) {
  unlockAudio(); sec = Math.max(5, Math.round(sec));
  S.timer.sec = sec; save();
  RT.dur = sec; RT.end = Date.now() + sec * 1000;
  clearInterval(RT.iv); RT.iv = setInterval(tickRest, 250); tickRest();
  document.body.classList.add('rt-on'); $('#rt').classList.remove('done');
  document.querySelectorAll('.restbtns button').forEach(b => b.classList.toggle('on', b.dataset.v ? +b.dataset.v === sec : ![30, 60, 90, 120].includes(sec)));
}
function tickRest() {
  const left = Math.max(0, Math.ceil((RT.end - Date.now()) / 1000));
  const p = RT.dur ? Math.min(1, 1 - (RT.end - Date.now()) / (RT.dur * 1000)) : 1;
  $('#rtTime').textContent = mmss(left);
  $('#rtRing').style.strokeDashoffset = String(100 * p);
  if (left <= 0) finishRest();
}
function finishRest() {
  clearInterval(RT.iv); RT.iv = null;
  $('#rt').classList.add('done'); $('#rtTime').textContent = '次のセット！';
  beep(); try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) {}
  try { if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification('インターバル終了', { body: '次のセットへ' }); } catch (e) {}
  setTimeout(() => { if (!RT.iv) stopRest(); }, 6000);
}
function stopRest() { clearInterval(RT.iv); RT.iv = null; document.body.classList.remove('rt-on'); $('#rt').classList.remove('done'); }
function restCustomSheet() {
  const m = Math.floor(S.timer.sec / 60), sc = S.timer.sec % 60;
  openSheet(`<div class="sh-h"><button data-act="close">キャンセル</button><h3>インターバル</h3><span style="min-width:64px"></span></div>
    <div class="card" style="padding:4px 16px"><div class="srow"><span>分</span>${stepper('rtm', m, 1, '分')}</div><div class="srow"><span>秒</span>${stepper('rts', sc, 5, '秒')}</div></div>
    <button class="btn" data-act="restGo">スタート</button>`);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && RT.iv) tickRest(); });

/* ----- 食事リマインダー ----- */
function checkRemind() {
  if (!S.remind.on) return;
  const s = sinceLastMeal(), h = new Date().getHours();
  if (!s || s.min < S.remind.min || S.remind.lastId === s.last.id || h < 6 || h >= 23) return;
  S.remind.lastId = s.last.id; save();
  const body = `前の食事（${s.last.t}）から ${s.txt} 経ちました`;
  let shown = false;
  try { if ('Notification' in window && Notification.permission === 'granted') { new Notification('そろそろ食事の時間です', { body }); shown = true; } } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  toast('🍽 ' + body, () => { go('home'); foodSheet(); }, '記録');
  if (cur === 'home') renderHome();
}

      <div class="srow" style="margin-top:8px;border-top:.5px solid var(--sep)"><span>期間</span>${stepper('fwk', pf.weeks, 1, '週')}</div>
      <div class="chips" style="padding:4px 0 0">${[4, 8, 12, 16, 24, 36].map(w => `<button data-act="setWeeks" data-v="${w}">${w}週</button>`).join('')}</div>
      <div class="sub num" id="fdate"></div>
      <div id="fsug"></div>
      <div class="field"><div class="lbl">この種目の頻度</div>${seg('freq', [[1, '週1'], [2, '週2'], [3, '週3']], pf.freq)}<div class="sub" id="freqNote"></div></div>
      <div class="field"><div class="lbl">モード</div>${seg('mode', [['cut', '減量'], ['maint', '維持'], ['bulk', '増量']], pf.mode)}</div>
      <div class="field"><div class="lbl">開始日</div><input type="date" id="fs" class="in" value="${pf.start}"></div>

    ${editPid ? '<div class="sub" style="text-align:center">更新すると完了チェックはリセットされます（記録は残ります）</div>' : ''}
    <button class="btn plain" data-act="planList">キャンセル</button>`;
}
function feas(cur, tgt, N, mode) {
  if (tgt <= cur) return ['muted', '今の実力で届く目標です'];
  const rate = (tgt / cur - 1) * 100 / N, lim = { cut: .6, maint: 1, bulk: 1.5 }[mode];
  if (rate <= lim) return ['accent', '無理のないペースです'];
  if (rate <= lim * 2) return ['warn', 'やや攻めた目標です'];
  return ['warn', 'かなり厳しいペース。期間を延ばすのがおすすめ'];
}
function planPreview() {
  if (!$('#pf1')) return;
  pf.w = num($('#fw').value); pf.r = Math.round(num($('#fr').value)); pf.target = num($('#ft').value); pf.start = $('#fs').value || today();
  pf.weeks = Math.round(num($('#fwk').value));
  const c = pf.w > 0 && pf.r > 0 ? e1rm(pf.w, pf.r) : 0;
  $('#pf1').textContent = c ? r1(c) : '—';
  const okW = pf.weeks >= 3 && pf.weeks <= 52;
  const [cls, t] = c && pf.target && okW ? feas(c, pf.target, pf.weeks, pf.mode) : ['muted', ''];
  $('#feas').className = 'feas ' + cls; $('#feas').textContent = t;
  const lastDay = addDays(pf.start, (pf.weeks - 1) * 7 + ({ 1: 0, 2: 3, 3: 4 })[pf.freq]);
  $('#fdate').innerHTML = okW ? `MAX挑戦日 <b style="color:var(--t1)">${fmtD(lastDay)}</b>（約${Math.round(pf.weeks / 4.3 * 10) / 10}か月）` : '<span class="warn">3〜52週で設定してください</span>';
  // 無理のないペースの期間を提案
  let sug = '';
  if (c && pf.target > c && cls === 'warn') {
    const lim = { cut: .6, maint: 1, bulk: 1.5 }[pf.mode], need = Math.min(52, Math.max(3, Math.ceil((pf.target / c - 1) * 100 / lim)));
    if (need > pf.weeks) sug = `<button class="btn ghost" style="height:40px;font-size:15px;margin-top:12px" data-act="setWeeks" data-v="${need}">無理のないペースなら ${need}週 → 設定する</button>`;
  }
  $('#fsug').innerHTML = sug;
  $('#freqNote').innerHTML = ({ 1: '高重量の日だけ', 2: '高重量の日 ＋ ボリュームの日', 3: '高重量 ＋ テクニック ＋ ボリュームの日' })[pf.freq] + ' · <button class="link" style="display:inline;margin:0" data-act="planInfo">組み方と根拠</button>';
}
/* ---- プラン生成（根拠は planInfo() を参照） ----
   ・4週1ブロック：3週かけて少しずつ重く（余力3→2→1回）、4週目は回復週（ボリューム半分）
   ・ブロックが進むほど回数を減らして重く：基礎（6回）→ 強化（4回）→ ピーク（2回）
   ・週2〜3回の日は役割を分ける（日替わり波状）：高重量／ボリューム／テクニック
   ・最後の1週はテーパー（ボリューム約半分・重さは維持）→ MAX挑戦
   ・重量は「目標の推定1RM × (余力込みの回数)」からO'Conner式で逆算 */
const KIND = { heavy: '高重量', vol: 'ボリューム', tech: 'テクニック', dl: '回復', taper: '調整', prime: '軽めの調整', max: 'MAX挑戦' };
const KIND_NOTE = { heavy: 'その日のメイン。重さに慣れる日', vol: '回数を多めに。筋量と練習量を稼ぐ日', tech: '軽めを速く正確に。フォームを固める日', dl: '疲労を抜く週。重さも量も控えめ', taper: '量を減らし、重さはキープ', prime: '本番前の動きの確認だけ', max: '目標重量に挑戦' };
const BLOCK = { base: { n: '基礎', h: 6 }, str: { n: '強化', h: 4 }, peak: { n: 'ピーク', h: 2 } };
const kindLabel = s => s.kind ? KIND[s.kind] : (s.label || '');
const rirTxt = s => s.rir != null ? `余力${s.rir}回` : '';
function genPlan(cfg, id) {
  const cur = e1rm(cfg.w, cfg.r), N = cfg.weeks, tgt = cfg.target, m = cfg.mode;
  const offs = { 1: [0], 2: [0, 3], 3: [0, 2, 4] }[cfg.freq];
  const roles = { 1: ['heavy'], 2: ['heavy', 'vol'], 3: ['heavy', 'tech', 'vol'] }[cfg.freq];
  const em = i => cur + (tgt - cur) * (i - 1) / Math.max(1, N - 1);        // その週に想定する推定1RM
  const wt = (e, reps, rir) => r25(e / (1 + (reps + rir) / 40));
  // 週の種類を決める
  const type = [];
  for (let i = 1; i <= N; i++) {
    if (i === N) type[i] = 'test';
    else if (N >= 5 && i === N - 1) type[i] = 'taper';
    else if (N >= 8 && i % 4 === 0) type[i] = 'dl';
    else type[i] = 'load';
  }
  // 回復週・テーパーで区切られた「負荷週のかたまり」ごとに1ブロック
  const groups = []; let g = [];
  for (let i = 1; i <= N; i++) { if (type[i] === 'load') g.push(i); else if (g.length) { groups.push(g); g = []; } }
  if (g.length) groups.push(g);
  const G = groups.length, seq = G === 1 ? ['str'] : G === 2 ? ['base', 'peak'] : G === 3 ? ['base', 'str', 'peak'] : null;
  const blockOfGroup = gi => seq ? seq[gi] : (gi / (G - 1) < .4 ? 'base' : gi / (G - 1) < .75 ? 'str' : 'peak');
  const gIdx = i => groups.findIndex(x => x.includes(i));
  const blockOf = i => blockOfGroup(gIdx(i));
  const volSets = { cut: 2, maint: 3, bulk: 4 }[m];            // 減量中は量を控えめに（強度は維持）
  const sessions = [];
  let prevBlock = null;
  for (let i = 1; i <= N; i++) {
    const ws = addDays(cfg.start, (i - 1) * 7), t = type[i], e = em(i);
    const push = (k, o, x) => sessions.push({ id: `${id}_${i}-${k}`, week: i, ph: x.ph, date: addDays(ws, o), done: false, ...x });
    if (t === 'load') {
      const bl = blockOf(i), H = BLOCK[bl].h;
      const pos = groups[gIdx(i)].indexOf(i);                                    // ブロック内の何週目か
      const rir = [3, 2, 1][Math.min(pos, 2)];
      roles.forEach((role, k2) => {
        if (role === 'heavy') push(k2, offs[k2], { ph: bl, kind: 'heavy', w: wt(e, H, rir), r: H, sets: cfg.freq === 1 ? 4 : 3, rir });
        if (role === 'vol') push(k2, offs[k2], { ph: bl, kind: 'vol', w: wt(e, H + 4, rir + 1), r: H + 4, sets: volSets, rir: rir + 1 });
        if (role === 'tech') push(k2, offs[k2], { ph: bl, kind: 'tech', w: r25(e * .72), r: 3, sets: 5, rir: 5 });
      });
      prevBlock = bl;
    } else if (t === 'dl') {
      const H = BLOCK[prevBlock || 'base'].h;
      roles.forEach((role, k2) => push(k2, offs[k2], { ph: 'dl', kind: 'dl', w: r25(wt(e, H, 4) * .9), r: H, sets: 2, rir: 5 }));
    } else if (t === 'taper') {
      roles.forEach((role, k2) => role === 'heavy'
        ? push(k2, offs[k2], { ph: 'taper', kind: 'taper', w: wt(e, 2, 1), r: 2, sets: 2, rir: 1 })
        : push(k2, offs[k2], { ph: 'taper', kind: 'prime', w: r25(e * .7), r: 3, sets: 2, rir: 5 }));
    } else {
      if (cfg.freq >= 2) push(0, 0, { ph: 'test', kind: 'prime', w: r25(tgt * .7), r: 3, sets: 2, rir: 5 });
      const warm = [.5, .7, .85, .93].map(x => r25(tgt * x)).join(' → ');
      push('m', offs[offs.length - 1], { ph: 'test', kind: 'max', w: tgt, r: 1, sets: 1, max: true, warm, label: 'W-up ' + warm });
    }
  }
  return { ...cfg, id, v: 2, part: partOf(cfg.ex), cur: r1(cur), sessions, targetDate: sessions[sessions.length - 1].date };
}

      <div class="group">

      <h4>4週で1ブロック</h4>
      <p>3週かけて余力を3回→2回→1回と減らしながら重くし、4週目は回復週（量を半分）にします。ブロックが進むほど回数を減らして重くします（基礎 6回 → 強化 4回 → ピーク 2回）。</p>

      <h4>重量の決め方</h4>
      <p>週ごとに「今の推定1RM → 目標」へ少しずつ上がる線を引き、その週の回数＋余力の回数から O'Conner式（1RM ＝ 重量 ×（1 ＋ 回数÷40））で重量を逆算しています。</p>
      <h4>減量中</h4>
      <p>カロリー不足は筋肉の増え方を落としますが、筋力の伸びへの影響は小さいとされています。そこで重さは維持し、ボリューム日のセット数だけ減らします。</p>

        <li>${L('Pritchard et al. (2016) 一流パワーリフターは試合前に量を約半分に減らし、強度は維持する', 'https://pubmed.ncbi.nlm.nih.gov/26670988/')}</li>
        <li>${L('Murphy & Koehler (2022) カロリー不足は筋量の伸びを妨げるが、筋力は妨げにくい（メタ分析）', 'https://pubmed.ncbi.nlm.nih.gov/34623696/')}</li>
      </ul>
      <p class="sub">4週ブロック・余力の段階・回数の割り当ては、上の研究とトレーニング現場で一般的なやり方をもとにした目安です。体調に合わせて調整してください。</p>

function calc() {
  if (!$('#e1v')) return;
  const w = num($('#lw').value), r = Math.round(num($('#lr').value)), ex = S.recEx;
  if (!(w > 0 && r > 0)) { $('#e1v').innerHTML = '—'; $('#e1m').textContent = ''; $('#rmt').innerHTML = ''; return; }
  const v = e1rm(w, r), best = bestOf(ex), goal = goalOf(ex);
  $('#e1v').innerHTML = `${r1(v)}<small>kg</small>`;
  let m = '', cls = '';
  if (goal && v >= goal) { m = '目標達成！'; cls = 'accent'; }
  else if (best && v > best) { m = `自己ベスト更新 +${r1(v - best)}kg`; cls = 'accent'; }
  else if (goal) m = `目標 ${goal}kg まで あと ${r1(goal - v)}kg`;
  else if (best) m = `ベスト ${best}kg`;
  $('#e1m').className = 'sub ' + cls; $('#e1m').textContent = m;
  $('#rmt').innerHTML = [1, 2, 3, 5, 6, 8, 10, 12, 15, 20].map(n => `<div><small>${n}RM</small><b>${n === 1 ? r1(v) : r25(v / (1 + n / 40))}</b></div>`).join('');
}
function renderHist() {
  const el = $('#hist'); if (!el) return;
  const sorted = S.logs.slice().sort((a, b) => a.date === b.date ? String(a.id).localeCompare(String(b.id)) : a.date < b.date ? -1 : 1);
  const run = {}, pb = new Set();
  sorted.forEach(l => { if (l.e1 > (run[l.ex] || 0)) { run[l.ex] = l.e1; pb.add(l.id); } });
  let items = [];
  if (recKind === 'cardio') items = S.cardio.map(c => ({ ...c, k: 'c' }));
  else {
    items = sorted.filter(l => histAll || l.ex === S.recEx).map(l => ({ ...l, k: 'l' }));
    if (histAll) items = items.concat(S.cardio.map(c => ({ ...c, k: 'c' })));
  }
  items.sort((a, b) => a.date === b.date ? String(b.id).localeCompare(String(a.id)) : a.date < b.date ? 1 : -1);
  items = items.slice(0, 120);
  if (!items.length) { el.innerHTML = '<div class="card empty"><div class="muted">まだ記録がありません</div></div>'; return; }
  const byDate = {};
  items.forEach(l => (byDate[l.date] = byDate[l.date] || []).push(l));
  const pbIcon = I.share.replace('class="i"', 'class="i" style="width:12px;height:12px;vertical-align:-1px"');
  el.innerHTML = Object.entries(byDate).map(([d, ls]) => `<div class="lbl" style="margin:16px 4px 8px">${fmtD(d)}</div><div class="group">
    ${ls.map(l => l.k === 'c'
      ? `<div class="row"><div class="grow"><div class="t">${esc(l.name)}</div><div class="s num">有酸素 · ${LVL[l.lvl]} · ${l.min}分 · ${l.kcal.toLocaleString()}kcal</div></div><button class="x" data-act="delCardio" data-id="${l.id}" aria-label="削除">${I.x}</button></div>`

      ${pb.has(l.id) ? `<button class="pill a" data-act="sharePB" data-id="${l.id}">PB ${pbIcon}</button>` : ''}<button class="x" data-act="delLog" data-id="${l.id}" aria-label="削除">${I.x}</button></div>`).join('')}
  </div>`).join('');
}
function drawChart(ex) {
  const el = $('#chart'); if (!el) return;
  const by = {};
  S.logs.filter(l => l.ex === ex).forEach(l => by[l.date] = Math.max(by[l.date] || 0, l.e1));
  const pts = Object.keys(by).sort().map(d => ({ d, v: by[d] }));
  if (pts.length < 2) { el.innerHTML = '<div class="empty" style="padding:16px"><div class="muted">2日分記録するとグラフが出ます</div></div>'; return; }
  const goal = goalOf(ex) || null;
  const vals = pts.map(p => p.v).concat(goal ? [goal] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pd = Math.max(2.5, (hi - lo) * .15); lo -= pd; hi += pd;
  const W = 340, H = 150, L = 4, R = 36, T = 12, B = 22;
  const x = i => L + (W - L - R) * i / (pts.length - 1), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const lastP = pts[pts.length - 1];
  el.innerHTML = `<div class="card-top"><span class="lbl">推定1RM</span><span class="num" style="font-weight:600">${lastP.v}kg</span></div>
  <svg viewBox="0 0 ${W} ${H}" style="margin-top:8px">
    ${[lo + (hi - lo) * .15, hi - (hi - lo) * .15].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--sep)" stroke-width=".5"/><text x="${W - R + 6}" y="${y(v) + 4}" style="fill:var(--t2)" font-size="10">${Math.round(v)}</text>`).join('')}
    ${goal ? `<line x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}" style="stroke:var(--t3)" stroke-dasharray="3 4"/><text x="${W - R + 6}" y="${y(goal) + 4}" style="fill:var(--t2)" font-size="10">目標</text>` : ''}
    <polyline points="${line}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(lastP.v)}" r="4" style="fill:var(--accent)"/>
    <text x="${L}" y="${H - 4}" style="fill:var(--t2)" font-size="10">${fmtD(pts[0].d)}</text>
    <text x="${W - R}" y="${H - 4}" style="fill:var(--t2)" font-size="10" text-anchor="end">${fmtD(lastP.d)}</text>
  </svg>`;
}

/* ================= 体重 ================= */
/* 体重は水分や食事で1日1〜2kg動くため、7日平均で比べる。週・月ごとの平均の差で増減を見る */
let wUnit = 'week', wAll = false;
const wSorted = () => S.weights.slice().sort((a, b) => a.date < b.date ? -1 : 1);
const wOn = k => { const x = S.weights.find(w => w.date === k); return x ? x.kg : null; };
function wAvg(from, to) {                                     // from〜to（両端含む）の平均
  const xs = S.weights.filter(w => w.date >= from && w.date <= to);
  return xs.length ? xs.reduce((a, w) => a + w.kg, 0) / xs.length : null;
}
const wPace = () => S.mode === 'cut' ? -S.body.bw * .005 : S.mode === 'bulk' ? S.body.bw * .0025 : 0;   // 目標の週あたり変化(kg)
const kgS = (n, d = 1) => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n).toFixed(d);
/* 増減の良し悪し：減量は増加/速すぎ、増量は減少/速すぎ、維持は±0.2kg超を注意 */
function wJudge(diff, pace) {
  if (S.mode === 'maint') return Math.abs(diff) <= .2 ? { t: 'キープできています', c: 'accent', ok: 1 } : { t: diff > 0 ? '増えています' : '減っています', c: 'warn' };
  const dir = S.mode === 'cut' ? -1 : 1, v = diff * dir, p = pace * dir;
  if (v < -.05) return { t: S.mode === 'cut' ? '増えています' : '減っています', c: 'warn' };
  if (v > p * (S.mode === 'cut' ? 1.8 : 2)) return { t: S.mode === 'cut' ? '速すぎ（筋肉が落ちやすい）' : '速すぎ（脂肪がつきやすい）', c: 'warn' };
  if (v < p * .5) return { t: 'ゆるやか', c: 'accent' };
  return { t: 'ペースどおり', c: 'accent', ok: 1 };
}
function wSummary() {
  const td = today(), cur = wAvg(addDays(td, -6), td), prev = wAvg(addDays(td, -13), addDays(td, -7));
  const all = wSorted(), span = all.length ? diffDays(all[0].date, td) : 0;
  return { cur, prev, diff: cur != null && prev != null ? cur - prev : null, pace: wPace(), span, last: all[all.length - 1] };
}
/* 週（月曜はじまり）または月ごとの平均と、前の期間との差 */
function wPeriods(unit) {
  const g = {};
  S.weights.forEach(w => { const k = unit === 'week' ? monday(w.date) : w.date.slice(0, 7); (g[k] = g[k] || []).push(w.kg); });
  const keys = Object.keys(g).sort();
  return keys.map((k, i) => { const avg = g[k].reduce((a, b) => a + b, 0) / g[k].length, pk = keys[i - 1];
    const prevAvg = pk ? g[pk].reduce((a, b) => a + b, 0) / g[pk].length : null;
    const adjacent = pk && (unit === 'week' ? diffDays(pk, k) === 7 : monthGap(pk, k) === 1);
    return { k, avg, n: g[k].length, diff: prevAvg != null && adjacent ? avg - prevAvg : null }; }).reverse();
}
const monthGap = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5) - +a.slice(5));

/* ホームの小さなカード */
function weightCard() {
  const s = wSummary(), tw = wOn(today());
  if (!s.last) return `<button class="card wcard" data-act="weigh"><div class="grow"><div class="lbl">体重</div><div class="t">今朝の体重を記録する</div><div class="sub" style="margin:4px 0 0">週・月ごとの増減がグラフで見られます</div></div><span class="plus">${I.plus}</span></button>`;
  const j = s.diff != null ? wJudge(s.diff, s.pace) : null;
  return `<div class="card wcard"><button class="grow wmain" data-act="goWeight">
      <div class="lbl">体重 · 7日平均</div>
      <div class="wv num">${(s.cur ?? s.last.kg).toFixed(1)}<small>kg</small>${s.diff != null ? `<span class="wd ${j.c}">${kgS(s.diff)}kg</span>` : ''}</div>
      <div class="sub" style="margin:2px 0 0">${s.diff != null ? `先週より · ${j.t}` : '1週間続けると先週との差が出ます'}</div></button>
    ${tw == null ? `<button class="wbtn" data-act="weigh">記録</button>` : `<button class="wtoday num" data-act="weigh"><span>今日</span>${tw.toFixed(1)}</button>`}</div>`;
}
function weighSheet(date) {
  const k = date || today(), v = wOn(k) ?? (wSorted().slice(-1)[0] || {}).kg ?? S.body.bw;
  openSheet(`<div class="sh-h"><button data-act="close">キャンセル</button><h3>体重を記録</h3><button data-act="saveWeight" style="font-weight:600">保存</button></div>
    <div class="group"><label class="row"><span class="grow">日付</span><input type="date" id="wdt" value="${k}" max="${today()}" style="background:transparent;color:var(--t2);font-size:17px;padding:4px 0;text-align:right"></label></div>
    <div class="card" style="margin-top:12px"><div class="srow" style="border:0"><span>体重</span>${stepper('wkg', Number(v).toFixed(1), .1, 'kg')}</div></div>
    <div class="sub" style="margin:8px 4px 0">毎朝、起きてトイレのあと・食べる前に測ると、日々のブレが小さくなります。最新の体重はカロリー計算にも使われます。</div>`);
}
function saveWeight() {
  const k = $('#wdt').value || today(), kg = r1(num($('#wkg').value));

  const old = S.weights.find(w => w.date === k), prevKg = old ? old.kg : null, prevBw = S.body.bw;
  if (old) old.kg = kg; else S.weights.push({ date: k, kg });
  const latest = wSorted().slice(-1)[0]; if (latest) S.body.bw = latest.kg;

  toast(`${kg.toFixed(1)}kg を記録しました`, () => { if (old) old.kg = prevKg; else S.weights = S.weights.filter(w => w.date !== k); S.body.bw = prevBw; save(); render(); });
}

/* 記録タブ：体重 */
function renderWeight(kindSeg) {
  const s = wSummary(), per = wPeriods(wUnit).slice(0, 12);
  let hero;
  if (!s.last) hero = `<div class="card empty"><div class="muted">まだ記録がありません。<br>毎日記録すると、週・月ごとの増減が見えるようになります</div><button class="btn" data-act="weigh">今日の体重を記録</button></div>`;
  else {
    const j = s.diff != null ? wJudge(s.diff, s.pace) : null;
    let adv = '';
    if (j && !j.ok) {
      if (s.span >= 14) {
        const kc = Math.max(-300, Math.min(300, r10((s.pace - s.diff) * 7700 / 7)));
        if (Math.abs(kc) >= 50) adv = `<div class="wkadj"><div class="lbl">カロリーの見直し</div>
          <div class="num">目標摂取を 1日 <b class="accent">${kc > 0 ? '+' : '−'}${Math.abs(kc)} kcal</b>（${S.targets.kcal.toLocaleString()} → ${(S.targets.kcal + kc).toLocaleString()}）</div>
          <div class="sub">2週続けてズレているときに調整するのがおすすめ。一度に動かすのは±300kcalまで。</div>
          <button class="wbtn" style="margin-top:12px" data-act="wAdj" data-v="${kc}">目標に反映する</button></div>`;
      } else adv = `<div class="sub" style="margin-top:12px">記録が2週間たまると、カロリーの調整量を提案します</div>`;
    }
    hero = `<div class="card">
      <div class="card-top"><span class="lbl">7日平均</span><button class="wbtn" data-act="weigh">${wOn(today()) == null ? '今日の体重を記録' : `今日 ${wOn(today()).toFixed(1)}kg · 修正`}</button></div>
      <div class="hero" style="margin-top:4px">${(s.cur ?? s.last.kg).toFixed(1)}<small>kg</small></div>
      <div class="goalline">${s.diff != null ? `先週より <b class="${j.c}">${kgS(s.diff)}kg</b> · ${j.t}` : '1週間続けると先週との差が出ます'}</div>
      <div class="sub num" style="margin-top:4px">目標ペース（${MODE[S.mode]}）：週 ${S.mode === 'maint' ? '±0' : kgS(s.pace, 2)}kg</div>
      ${adv}
      <div class="wtip num" id="wtip"></div>
      <div id="wchart"></div>
      <div class="wleg"><span><i class="dot"></i>毎日の体重</span><span><i class="ln"></i>7日平均</span>${S.mode !== 'maint' ? '<span><i class="ln dash"></i>目標ペース</span>' : ''}</div>
    </div>`;
  }
  const maxAbs = Math.max(.3, ...per.filter(p => p.diff != null).map(p => Math.abs(p.diff)));
  const pp = wUnit === 'week' ? s.pace : s.pace * 30.4 / 7;
  const label = p => { if (wUnit === 'week') { const e = addDays(p.k, 6), f = x => { const d = parseKey(x); return `${d.getMonth() + 1}/${d.getDate()}`; }; return `${f(p.k)}〜${f(e)}`; } return `${+p.k.slice(0, 4)}年${+p.k.slice(5)}月`; };
  const list = per.length ? `<div class="group">${per.map(p => { const j = p.diff != null ? wJudge(p.diff, pp) : null, w = p.diff != null ? Math.max(2, Math.abs(p.diff) / maxAbs * 50) : 0;
    return `<div class="row wrow"><div class="wl"><div class="t num">${label(p)}</div><div class="s num">平均 ${p.avg.toFixed(1)}kg · ${p.n}日</div></div>
      <div class="wbar"><i class="${p.diff == null ? '' : p.diff > 0 ? 'up' : 'dn'} ${j ? j.c : ''}" style="width:${w}%"></i></div>
      <span class="kc num ${j && j.c === 'warn' ? 'warn' : ''}">${p.diff == null ? '—' : kgS(p.diff) + 'kg'}</span></div>`; }).join('')}</div>
    <div class="sub" style="margin:8px 4px 0">前の${wUnit === 'week' ? '週' : '月'}の平均との差。棒は右が増加、左が減少。目標ペースは${wUnit === 'week' ? '週' : '月'} ${S.mode === 'maint' ? '±0' : kgS(pp, 2)}kg</div>` : '';
  const histAllW = wSorted().reverse(), hist = histAllW.slice(0, wAll ? 400 : 14);
  $('#tab-log').innerHTML = header('記録') + kindSeg + hero + `
    <div class="sec"><b>増減</b></div>
    <div style="margin-bottom:12px">${seg('wunit', [['week', '週ごと'], ['month', '月ごと']], wUnit)}</div>
    ${list || '<div class="card empty"><div class="muted">記録がたまると、ここに週・月ごとの増減が並びます</div></div>'}
    ${hist.length ? `<div class="sec"><b>履歴</b></div><div class="group">${hist.map(w => `<div class="row"><button class="grow t num" data-act="weighEdit" data-v="${w.date}" style="text-align:left">${fmtD(w.date)}</button><span class="kc num">${w.kg.toFixed(1)} kg</span><button class="x" data-act="delWeight" data-v="${w.date}" aria-label="削除">${I.x}</button></div>`).join('')}</div>${histAllW.length > 14 ? `<button class="link" style="margin:8px 4px" data-act="wAll">${wAll ? '閉じる' : `すべて表示（${histAllW.length}日）`}</button>` : ''}` : ''}`;
  if (s.last) drawWeightChart();
}
/* 折れ線：毎日の体重（点）＋7日平均（線）＋目標ペース（点線）。タップで値を表示 */
function drawWeightChart() {
  const el = $('#wchart'); if (!el) return;
  const td = today(), days = wUnit === 'week' ? 84 : 365, all = wSorted(), first = all[0].date;
  const start = first > addDays(td, -days + 1) ? first : addDays(td, -days + 1), N = Math.max(1, diffDays(start, td));
  const pts = all.filter(w => w.date >= start);
  const avg = []; for (let i = 0; i <= N; i++) { const k = addDays(start, i); if (!pts.some(w => w.date === k)) continue; const a = wAvg(addDays(k, -6), k); avg.push({ k, i, v: a }); }
  const a0 = avg[0], pace = wPace() / 7, tgt = S.mode === 'maint' || !a0 ? null : [a0, { i: N, v: a0.v + pace * (N - a0.i) }];
  const vals = pts.map(w => w.kg).concat(tgt ? tgt.map(t => t.v) : []);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pd = Math.max(.5, (hi - lo) * .15); lo -= pd; hi += pd;
  const W = 340, H = 170, L = 4, R = 40, T = 10, B = 22;
  const x = i => L + (W - L - R) * i / N, y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const gl = [lo + pd, (lo + hi) / 2, hi - pd];
  const md = k => { const d = parseKey(k); return `${d.getMonth() + 1}/${d.getDate()}`; };
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" id="wsvg" style="margin-top:4px;touch-action:pan-y">
    ${gl.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--sep)" stroke-width=".5"/><text x="${W - R + 6}" y="${y(v) + 4}" style="fill:var(--t2)" font-size="10">${v.toFixed(1)}</text>`).join('')}
    ${tgt ? `<line x1="${x(tgt[0].i)}" y1="${y(tgt[0].v)}" x2="${x(tgt[1].i)}" y2="${y(tgt[1].v)}" style="stroke:var(--t3)" stroke-width="1.5" stroke-dasharray="4 4"/>` : ''}
    ${pts.map(w => `<circle cx="${x(diffDays(start, w.date)).toFixed(1)}" cy="${y(w.kg).toFixed(1)}" r="2.5" style="fill:var(--t3)"/>`).join('')}
    ${avg.length > 1 ? `<polyline points="${avg.map(p => `${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    <line id="wguide" y1="${T}" y2="${H - B}" style="stroke:var(--t2);display:none" stroke-width="1"/>
    <circle id="wdot" r="5" style="fill:var(--accent);stroke:var(--s1);display:none" stroke-width="2"/>
    <text x="${L}" y="${H - 4}" style="fill:var(--t2)" font-size="10">${md(start)}</text>
    <text x="${W - R}" y="${H - 4}" style="fill:var(--t2)" font-size="10" text-anchor="end">${md(td)}</text>
  </svg>`;
  const svg = $('#wsvg'), tip = $('#wtip'), show = p => {
    const g = $('#wguide'), dt = $('#wdot'), kg = wOn(p.k);
    g.setAttribute('x1', x(p.i)); g.setAttribute('x2', x(p.i)); g.style.display = ''; dt.setAttribute('cx', x(p.i)); dt.setAttribute('cy', y(p.v)); dt.style.display = '';
    tip.innerHTML = `${fmtD(p.k)}　<b>${kg.toFixed(1)}kg</b>　<span>7日平均 ${p.v.toFixed(1)}kg</span>`;
  };
  const pick = e => { const r = svg.getBoundingClientRect(), i = ((e.clientX - r.left) / r.width * W - L) / (W - L - R) * N;
    let best = avg[0]; avg.forEach(p => { if (Math.abs(p.i - i) < Math.abs(best.i - i)) best = p; }); show(best); };
  svg.addEventListener('pointerdown', pick); svg.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') pick(e); });
  show(avg[avg.length - 1]);
}

/* ================= CALENDAR ================= */
let calM = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let calPart = 'all', calSel = today();
function renderCal() {
  const logs = S.logs.filter(l => calPart === 'all' || partOf(l.ex) === calPart);
  const cards = S.cardio.filter(() => calPart === 'all' || calPart === '有酸素');
  const trained = {}; logs.forEach(l => (trained[l.date] = trained[l.date] || []).push(l));
  const cTrained = {}; cards.forEach(c => { (cTrained[c.date] = cTrained[c.date] || []).push(c); trained[c.date] = trained[c.date] || []; });
  const planned = {};
  if (calPart !== '有酸素') S.plans.forEach(P => { if (calPart !== 'all' && (P.part || partOf(P.ex)) !== calPart) return;
    P.sessions.forEach(s => { if (!s.done && s.date >= today()) (planned[s.date] = planned[s.date] || []).push({ P, s }); }); });
  const last = {}; S.logs.forEach(l => { const p = partOf(l.ex); if (!last[p] || l.date > last[p]) last[p] = l.date; });
  S.cardio.forEach(c => { if (!last['有酸素'] || c.date > last['有酸素']) last['有酸素'] = c.date; });
  const anyLast = [...S.logs, ...S.cardio].reduce((m, x) => !m || x.date > m ? x.date : m, null);
  const tiles = [...PARTS, '有酸素'].map(p => { const d = last[p], n = d ? diffDays(d, today()) : null;
    return `<button class="tile ${calPart === p ? 'on' : ''}" data-act="calPart" data-v="${p}"><div class="n">${p}</div><div class="v ${n !== null && n >= 7 ? 'warn' : ''}">${daysAgo(d)}</div></button>`; }).join('')
    + `<button class="tile ${calPart === 'all' ? 'on' : ''}" data-act="calPart" data-v="all"><div class="n">すべて</div><div class="v">${daysAgo(anyLast)}</div></button>`;

  const y = calM.getFullYear(), m = calM.getMonth(), first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let cells = [...WD].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < first; i++) cells += '<div></div>';
  let count = 0;

    cells += `<button class="cd ${has ? 'has' : ''} ${planned[k] ? 'plan' : ''} ${k === today() ? 'today' : ''} ${k === calSel ? 'sel' : ''}" data-act="calDay" data-d="${k}"><span>${d}</span></button>`;
  }

  const dayList = Object.entries(byEx).map(([ex, ls]) => `<div class="row"><span class="ck" style="width:24px;height:24px">${I.check}</span><div class="grow"><div class="t">${esc(ex)}</div><div class="s num">${setsSummary(ls)}</div></div><span class="pill">${partOf(ex)}</span></div>`).join('')
    + selPlan.map(({ P, s }) => `<div class="row"><span class="circ"></span><div class="grow"><div class="t">${esc(P.ex)}</div><div class="s num">予定 ${s.max ? 'MAX ' + fmtN(s.w) + 'kg' : fmtSet(s.w, s.r, s.sets)}</div></div><span class="pill">${esc(P.part || partOf(P.ex))}</span></div>`).join('')
    + (cTrained[calSel] || []).map(c => `<div class="row"><span class="ck" style="width:24px;height:24px">${I.check}</span><div class="grow"><div class="t">${esc(c.name)}</div><div class="s num">${LVL[c.lvl]} · ${c.min}分 · ${c.kcal}kcal</div></div><span class="pill">有酸素</span></div>`).join('');

  $('#tab-cal').innerHTML = header('カレンダー') + `
    <div class="sec" style="margin-top:4px"><b>最後にやった日</b><span>タップで絞り込み</span></div>
    <div class="tiles">${tiles}</div>
    <div class="card" style="margin-top:12px">
      <div class="cal-h"><b>${y}年${m + 1}月 <span class="muted" style="font-weight:400;font-size:15px;margin-left:8px">${calPart === 'all' ? '' : calPart + ' · '}${count}日</span></b>
        <div class="nav"><button data-act="calPrev" aria-label="前の月">${I.left}</button><button data-act="calNext" aria-label="次の月">${I.right}</button></div></div>

const Y_STATS = H => H - 136;          // 下段の数値のベースライン（8の倍数）
const PART_EN = { '胸': 'CHEST', '背中': 'BACK', '肩': 'SHOULDERS', '腕': 'ARMS', '脚': 'LEGS', '腹': 'ABS', '有酸素': 'CARDIO', 'その他': 'OTHER' };

/* 種目ブロック：種目名 28px ＋ セット行 40px（数値）/24px（単位）で固定。行が増えたら画像を縦に伸ばす */
const SET_LH = 56, NAME_B = 44, BLOCK_PAD = 24;

const titleH = t => t.z * .74 + (t.lines.length - 1) * Math.round(t.z * 1.05);

/* その日のメニュー：何を・どれだけ やったかを主役に */
function trainRows(date = today()) {

  const byEx = {}; logs.forEach(l => (byEx[l.ex] = byEx[l.ex] || []).push(l));
  let rows = Object.entries(byEx).map(([ex, ls]) => ({ n: ex, part: partOf(ex), lines: setGroups(ls) }))
    .concat(cs.map(v => ({ n: v.name, part: '有酸素', lines: [{ min: v.min, lvl: LVL[v.lvl] }] })));
  let planned = false;
  if (!rows.length && date >= today()) {
    rows = S.plans.flatMap(P => P.sessions.filter(s => s.date === date).map(s => ({ n: P.ex, part: P.part || partOf(P.ex), lines: [{ w: s.w, r: s.r, sets: s.sets }] })));

}
/* 等幅数字：数字1文字ずつを同じ幅のマスに置いて右揃え（1 と 4 の幅の差で列がずれないように） */
function TN(x, str, right, y, size, o = {}) {

}

    T(x, ln.lvl, COLX.w + 96, y, 28, { w: 600, c: C.dim });

function sceneTrain(x, W, H) {

  stats(x, W, [{ l: 'EXERCISES', v: String(rows.length) }, { l: planned ? 'STATUS' : 'SETS', v: planned ? 'PLAN' : String(sets) }, { l: 'BURN', v: planned ? '—' : fmtK(b.strength + b.cardio), u: planned ? '' : 'KCAL' }], yB);

function renderShot() {
  C = sh.style === 'white' ? PAL_LIGHT : PAL_DARK;
  const W = 1080, H0 = sh.ratio === 'story' ? 1920 : 1350;
  const H = sh.kind === 'train' ? Math.max(H0, Math.ceil((trainNeedH(W) + (solidBg() ? 64 : 0)) / 8) * 8) : H0;

  const scene = xx => sh.kind === 'train' ? sceneTrain(xx, W, H) : sh.kind === 'balance' ? sceneBalance(xx, W, H) : sh.kind === 'plan' ? scenePlan(xx, W, H, findPlan(sh.arg)) : scenePR(xx, W, H, sh.arg);
  if (solidBg()) {
    // 黒・白背景：内容ブロックをやや上寄りの中央へ（8pxに丸める）
    const probe = document.createElement('canvas').getContext('2d');
    const top = scene(probe), blockH = Y_STATS(H) - top;
    const areaTop = 176, areaBot = H - 152, want = Math.round((areaTop + Math.max(0, areaBot - areaTop - blockH) * 0.42) / 8) * 8;
    x.save(); x.translate(0, Math.min(0, want - top)); scene(x); x.restore();

    T(x, '#WorkoutPlanner', W - M, H - 64, IMG.cap, { w: 600, c: C.dim, a: 'right' });

  const img = $('#shotImg'); if (img) img.src = c.toDataURL('image/png');
  $('#shotWrap').classList.toggle('clear', sh.style === 'clear');
  $('#shotWrap').classList.toggle('white', sh.style === 'white');
  $('#photoPick').classList.toggle('hidden', sh.style !== 'photo');
  $('#photoPick').textContent = sh.photo ? '写真を変更' : '写真を選ぶ';
}
async function shareShow(kind, arg) {

  if (!sh.touched && (sh.style === 'black' || sh.style === 'white')) sh.style = isLight() ? 'white' : 'black';
  try { await Promise.race([document.fonts.load(`800 100px "Inter Tight"`), new Promise(r => setTimeout(r, 1200))]); } catch (e) {}

      <div class="daychips">${[['0', '今日'], ['1', '昨日'], ['2', 'おととい']].map(([k, l]) => `<button data-act="shDay" data-v="${k}" class="${k === '0' ? 'on' : ''}">${l}</button>`).join('')}</div>` : ''}

    <div class="sub" style="text-align:center">透過はストーリーで自分の写真に重ねるのがおすすめ</div>`);

const waitBlob = async () => { for (let i = 0; i < 60 && !sh.blob; i++) await new Promise(r => setTimeout(r, 50)); return sh.blob; };

  const blob = await waitBlob(); if (!blob) return;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) {
    try { await dl.save({ filename: sh.name, data: blob }); toast('保存しました'); }
    catch (e) { if (e && e.code === 'declined') return; toast('保存できませんでした。画像を長押しで保存してください'); }
    return;
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = sh.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('保存しました'); }

}

/* ================= Events ================= */
document.addEventListener('input', e => {
  if (['fw', 'fr', 'ft', 'fs', 'fwk'].includes(e.target.id)) planPreview();
  if (['lw', 'lr'].includes(e.target.id)) calc();
});

document.addEventListener('click', e => {
  const stp = e.target.closest('[data-step]');
  if (stp) {
    const inp = stp.parentElement.querySelector('input'), step = parseFloat(stp.dataset.step);
    let v = Math.max(0, r1(num(inp.value) + step)); if (['as', 'ls', 'fqty'].includes(inp.id)) v = Math.max(inp.id === 'fqty' ? Math.abs(step) : 1, v);

    if (inp.id === 'cmin') v = Math.max(5, v);
    if (inp.id === 'rmMin') v = Math.max(30, v);
    inp.value = v; inp.dispatchEvent(new Event('input', { bubbles: true })); return;
  }
  const sb = e.target.closest('.seg button');
  if (sb) {
    const sg = sb.parentElement, v = sb.dataset.v, name = sg.dataset.seg;
    sg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === sb));
    if (name === 'freq') pf.freq = +v;
    if (name === 'mode') pf.mode = v;
    if (['freq', 'mode'].includes(name)) planPreview();
    if (name === 'clvl') { cdo.lvl = +v; updCardio(); }
    if (name === 'hist') { histAll = v === '1'; renderHist(); }
    if (name === 'wunit') { wUnit = v; renderLog(); }
    if (name === 'rkind') { recKind = v; renderLog(); }
    if (name === 'shstyle') { sh.style = v; sh.touched = true; if (v === 'photo' && !sh.photo) $('#photoIn').click(); renderShot(); }
    if (name === 'shratio') { sh.ratio = v; renderShot(); }
    if (name === 'fslot') { fs.slot = v; if (fs.item) updFood(); }
    if (name === 'cslot') $('#panel').dataset.slot = v;
    if (name === 'mslot') { const m = mealsToday().find(x => x.id === $('#panel').dataset.mid); if (m) { m.slot = v; save(); renderHome(); } }
    if (name === 'bview') { balView = v; wkOff = 0; renderHome(); }
    if (name === 'seat') { S.eatBack = +v; save(); $('#ebNote').innerHTML = ebNote(); }
    if (name === 'stheme' || name === 'ttheme') { S.theme = v; save(); applyTheme(); render(); }
    if (name === 'sact' || name === 'ssex') { st.b[name === 'sact' ? 'act' : 'sex'] = v; readProfile('s', st.b); $('#srefs').innerHTML = refCards(st.b, st.mode); applyRefToInputs(); }
    if (name === 'tact' || name === 'tsex') { tu.b[name === 'tact' ? 'act' : 'sex'] = v; readProfile('t', tu.b); $('#trefs').innerHTML = refCards(tu.b, tu.mode); }
    return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const d = a.dataset;
  switch (d.act) {
    case 'close': closeSheet(); break;
    case 'wk': wkOff = Math.min(0, wkOff + +d.v); renderHome(); break;
    case 'settings': settingsSheet(); break;
    case 'goPlan': pv = 'form'; editPid = null; initPf(); go('plan'); break;

    /* 食事 */
    case 'food': foodSheet(d.slot); break;
    case 'fPreset': addKeep(S.presets[+d.i]); break;
    case 'fRecent': addKeep(recentFoods()[+d.i]); break;
    case 'fCat': fs.q = d.q; $('#fq').value = a.textContent; fs.item = null; renderFood(); break;
    case 'fUndo': S.meals[today()] = mealsToday().filter(m => m.id !== d.id); fs.added = fs.added.filter(x => x !== d.id); save(); renderAdded(); if (cur === 'home') renderHome(); break;
    case 'backFood': foodSheet(fs.slot, true); break;
    case 'fPick': fs.item = { src: 'db', ...fs.res[+d.i] }; if (fs.item.i !== undefined && fs.res[+d.i].src === 'preset') fs.item.src = 'preset'; renderFood(); $('#panel').scrollTop = 0; break;
    case 'fBack': fs.item = null; renderFood(); break;
    case 'fAdd': {
      const s = foodScaled();
      if ($('#fsave') && $('#fsave').checked) S.presets.push({ name: s.name, kcal: Math.round(s.kcal), p: r1(s.p), f: r1(s.f), c: r1(s.c) });
      addKeep(s); break;
    }
    case 'customMeal': customMealSheet(fs.slot); break;
    case 'saveCustom': {
      const p = num($('#cp').value), f = num($('#cf').value), c = num($('#cc').value), k = Math.round(calcK());
      if (!k) { toast('カロリーかPFCを入力してください'); break; }
      const item = { name: $('#cn').value.trim() || '手入力', kcal: k, p, f, c }, slot = $('#panel').dataset.slot;
      if ($('#cs').checked) S.presets.push(item);
      fs.t = ($('#ctime') && $('#ctime').value) || nowHM(); fs.slot = slot;
      foodSheet(slot, true); addKeep(item); break;
    }
    case 'editMeal': editMealSheet(d.id); break;
    case 'delMeal': {
      const list = mealsToday(), idx = list.findIndex(m => m.id === d.id); if (idx < 0) break;
      const [rm] = list.splice(idx, 1); save(); closeSheet(); renderHome();
      toast('削除しました', () => { mealsToday().splice(idx, 0, rm); save(); renderHome(); }); break;
    }

    /* トレ完了 */
    case 'complete': completeSheet(d.pid, d.id); break;
    case 'saveComplete': {
      const P = findPlan(d.pid), s = P.sessions.find(x => x.id === d.id);
      const w = num($('#aw').value), r = Math.round(num($('#ar').value)), sets = Math.max(1, Math.round(num($('#as').value)));
      if (!(r > 0)) { toast('回数を入力してください'); break; }
      const est = r1(e1rm(w, r)), prev = bestOf(P.ex);
      S.logs.push({ id: uid(), date: today(), ex: P.ex, w, r, sets, e1: est, pid: P.id, sid: s.id });
      s.done = true; s.actual = { w, r, sets }; save(); closeSheet(); render();
      if (S.timer.auto) startRest(S.timer.sec);
      if (est >= P.target || (prev && est > prev)) { const pr = { ex: P.ex, w, r, e1: est, prev, goal: est >= P.target ? P.target : 0, date: today() };
        toast(est >= P.target ? '🎉 目標達成！' : `自己ベスト更新 ${est}kg`, () => shareShow('pr', pr), 'シェア'); }
      else toast('ナイス！記録しました'); break;
    }
    case 'uncomplete': case 'toggle': {
      const P = findPlan(d.pid), s = P.sessions.find(x => x.id === d.id);
      if (s.done) { s.done = false; delete s.actual; S.logs = S.logs.filter(l => l.sid !== s.id); }
      else {
        s.done = true;
        if (s.date <= today() && !S.logs.some(l => l.sid === s.id)) S.logs.push({ id: uid(), date: s.date, ex: P.ex, w: s.w, r: s.r, sets: s.sets, e1: r1(e1rm(s.w, s.r)), pid: P.id, sid: s.id });
      }
      save(); render(); break;
    }

    /* プラン */
    case 'newPlan': pv = 'form'; editPid = null; initPf(); renderPlan(); window.scrollTo(0, 0); break;
    case 'openPlan': pv = d.id; renderPlan(); window.scrollTo(0, 0); break;
    case 'planList': pv = null; editPid = null; renderPlan(); window.scrollTo(0, 0); break;
    case 'editPlan': pv = 'form'; editPid = d.id; initPf(findPlan(d.id)); renderPlan(); window.scrollTo(0, 0); break;
    case 'dupPlan': {
      const P = findPlan(d.id), best = bestOf(P.ex);
      pv = 'form'; editPid = null; initPf({ ...P, id: null, w: best ? r25(best / 1.25) : P.w, r: 10, target: r25((best || P.target) * 1.05) });
      renderPlan(); window.scrollTo(0, 0); break;
    }
    case 'delPlan': {
      const P = findPlan(d.id);
      ask(`「${P.ex}」のプランを削除しますか？`, '削除する', () => {
        const idx = S.plans.indexOf(P); S.plans.splice(idx, 1); save(); pv = null; renderPlan();
        toast('プランを削除しました', () => { S.plans.splice(idx, 0, P); save(); renderPlan(); });
      }); break;
    }
    case 'genPlan': {
      planPreview();
      if (!(pf.w > 0 && pf.r > 0)) { toast('いまの重量と回数を入れてください'); break; }
      if (!(pf.target > 0)) { toast('目標1RMを入れてください'); break; }
      if (!(pf.weeks >= 3 && pf.weeks <= 52)) { toast('期間は3〜52週で設定してください'); break; }
      const id = editPid || 'p' + uid(), P = genPlan({ ...pf }, id);
      if (editPid) { const i = S.plans.findIndex(x => x.id === editPid); S.plans[i] = P; S.logs.forEach(l => { if (l.pid === id) delete l.sid; }); }
      else S.plans.push(P);
      save(); pv = id; editPid = null; renderPlan(); window.scrollTo(0, 0);
      toast(`MAX挑戦日は ${fmtD(P.targetDate)}`); break;
    }

    /* 種目ピッカー */
    case 'pickPlanEx': openPicker(n => { pf.ex = n; renderPlan(); }); break;
    case 'pickRecEx': openPicker(n => { S.recEx = n; save(); renderLog(); }); break;
    case 'pkPart': pk.part = d.v; pk.q = ''; pk.adding = false; $('#pkq').value = ''; renderPicker(); break;
    case 'pkPick': closeSheet(); pk.cb(d.n); break;
    case 'pkAdd': pk.adding = true; renderPicker(); break;
    case 'pkAddPart': S.customEx.push({ name: pk.q, part: d.v }); save(); closeSheet(); pk.cb(pk.q); toast('マイ種目に追加しました'); break;
    case 'pkDel': e.stopPropagation(); S.customEx = S.customEx.filter(c => c.name !== d.n); save(); renderPicker(); break;

    /* 記録 */
    case 'saveLog': {
      const w = num($('#lw').value), r = Math.round(num($('#lr').value)), sets = Math.max(1, Math.round(num($('#ls').value)));
      if (!(r > 0)) { toast('回数を入力してください'); break; }
      const log = { id: uid(), date: $('#ld').value || today(), ex: S.recEx, w, r, sets, e1: r1(e1rm(w, r)) };
      if (S.timer.auto) startRest(S.timer.sec);
      const prev = bestOf(S.recEx);
      S.logs.push(log); save(); drawChart(S.recEx); renderHist(); calc();
      if (prev && log.e1 > prev) { const g = goalOf(S.recEx); toast(`自己ベスト更新 ${log.e1}kg`, () => shareShow('pr', { ex: log.ex, w, r, e1: log.e1, prev, goal: g && log.e1 >= g ? g : 0, date: log.date }), 'シェア'); }
      else toast('保存しました', () => { S.logs = S.logs.filter(l => l.id !== log.id); save(); renderLog(); }); break;
    }
    case 'delLog': {
      const idx = S.logs.findIndex(l => String(l.id) === d.id); if (idx < 0) break;
      const [rm] = S.logs.splice(idx, 1); save(); drawChart(S.recEx); renderHist();
      toast('削除しました', () => { S.logs.push(rm); save(); drawChart(S.recEx); renderHist(); }); break;
    }

    /* 有酸素 */
    case 'goLog': go('log'); break;
    case 'planInfo': planInfo(); break;
    case 'rest': startRest(+d.v); break;
    case 'restCustom': restCustomSheet(); break;
    case 'restGo': { const sec = Math.round(num($('#rtm').value)) * 60 + Math.round(num($('#rts').value)); closeSheet(); startRest(sec || 60); break; }
    case 'restAdd': if (RT.iv) { RT.end += (+d.v) * 1000; RT.dur = Math.max(1, RT.dur + (+d.v)); tickRest(); } break;
    case 'restStop': stopRest(); break;
    case 'theme': S.theme = isLight() ? 'dark' : 'light'; save(); applyTheme(); render(); toast(isLight() ? 'ライトモード' : 'ダークモード'); break;
    case 'openPlanFromHome': pv = d.id; go('plan'); break;
    case 'calcInfo': calcInfo(); break;
    case 'cdPick': cdo.i = +d.i; updCardio(); break;
    case 'saveCardio': {
      const min = Math.round(num($('#cmin').value)); if (!(min > 0)) { toast('時間を入力してください'); break; }
      const c = CARDIO[cdo.i], item = { id: uid(), date: today(), name: c[0], lvl: cdo.lvl, min, kcal: metKcal(c[1][cdo.lvl], min) };
      S.cardio.push(item); save(); closeSheet(); render();
      toast(`${c[0]} −${item.kcal} kcal`, () => { S.cardio = S.cardio.filter(x => x.id !== item.id); save(); render(); }); break;
    }
    case 'delCardio': {
      const idx = S.cardio.findIndex(c => c.id === d.id); if (idx < 0) break;
      const [rm] = S.cardio.splice(idx, 1); save(); render();
      toast('削除しました', () => { S.cardio.splice(idx, 0, rm); save(); render(); }); break;
    }
    case 'weigh': weighSheet(); break;
    case 'wAll': wAll = !wAll; renderLog(); break;
    case 'weighEdit': weighSheet(d.v); break;
    case 'saveWeight': saveWeight(); break;
    case 'goWeight': recKind = 'weight'; go('log'); break;
    case 'delWeight': {
      const idx = S.weights.findIndex(w => w.date === d.v); if (idx < 0) break;
      const [rm] = S.weights.splice(idx, 1); save(); render();
      toast('削除しました', () => { S.weights.push(rm); save(); render(); }); break;
    }
    case 'wAdj': {
      const kc = +d.v, old = { ...S.targets };
      S.targets.kcal += kc; S.targets.c = Math.max(0, S.targets.c + Math.round(kc / 4)); save(); render();
      toast(`目標を ${S.targets.kcal.toLocaleString()} kcal にしました`, () => { S.targets = old; save(); render(); }); break;
    }
    case 'setWeeks': $('#fwk').value = d.v; planPreview(); break;

    /* シェア */
    case 'share': shareShow(d.v, d.id); break;
    case 'sharePB': { const l = S.logs.find(x => String(x.id) === d.id); if (!l) break;
      const prev = S.logs.filter(x => x.ex === l.ex && (x.date < l.date || (x.date === l.date && String(x.id) < String(l.id)))).reduce((m, x) => Math.max(m, x.e1), 0);
      shareShow('pr', { ex: l.ex, w: l.w, r: l.r, e1: l.e1, prev, goal: 0, date: l.date }); break; }
    case 'photoPick': $('#photoIn').click(); break;
    case 'shDay': sh.date = addDays(today(), -(+d.v)); $('#shd').value = sh.date; document.querySelectorAll('[data-act=shDay]').forEach(b => b.classList.toggle('on', b === a)); renderShot(); break;
    case 'shotSave': shotSave(); break;
    case 'shotShare': shotShare(); break;

    /* カレンダー */
    case 'calPart': calPart = calPart === d.v ? 'all' : d.v; renderCal(); break;
    case 'calDay': calSel = d.d; renderCal(); break;
    case 'calPrev': calM = new Date(calM.getFullYear(), calM.getMonth() - 1, 1); renderCal(); break;
    case 'calNext': calM = new Date(calM.getFullYear(), calM.getMonth() + 1, 1); renderCal(); break;

    /* 設定 */
    case 'pickRef':
      if ($('#tut').classList.contains('open')) { tu.mode = d.v; readProfile('t', tu.b); $('#trefs').innerHTML = refCards(tu.b, tu.mode); }
      else { st.mode = d.v; readProfile('s', st.b); $('#srefs').innerHTML = refCards(st.b, st.mode); applyRefToInputs(); }
      break;
    case 'saveSettings':
      S.targets = { kcal: num($('#sk').value) || 2000, p: num($('#sp').value), f: num($('#sf').value), c: num($('#sc').value) };
      S.mode = st.mode; S.body = { ...readProfile('s', st.b) };
      S.remind.on = $('#rmOn').checked; S.remind.min = Math.max(30, Math.round(num($('#rmMin').value)) || 180); save(); closeSheet(); render(); toast('保存しました'); break;
    case 'delPreset': S.presets.splice(+d.i, 1); save(); a.closest('.row').remove(); break;
    case 'tutorial': closeSheet(); openTutorial(); break;
    case 'backup': {
      const txt = JSON.stringify(S), ta = $('#bText'); ta.value = txt; ta.classList.remove('hidden');
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('コピーしました'), () => { ta.select(); toast('枠の中身をコピーしてください'); });
      break;
    }
    case 'restore': $('#bText').value = ''; $('#bText').classList.remove('hidden'); $('#bGo').classList.remove('hidden'); $('#bText').focus(); break;
    case 'restoreGo':
      try { const dd = JSON.parse($('#bText').value); if (!dd || !dd.targets) throw 0;
        ask('今のデータを置き換えますか？', '復元する', () => { localStorage.setItem(KEY, JSON.stringify({ ...dd, onboarded: true })); S = load(); closeSheet(); pv = null; render(); toast('復元しました'); });
      } catch (err) { toast('形式が正しくありません'); }
      break;
    case 'reset': ask('すべてのデータを削除しますか？', '削除する', () => { S = clone(DEF); S.onboarded = true; save(); closeSheet(); pv = null; render(); toast('削除しました'); }); break;
    case 'askOk': $('#ask').classList.remove('open'); askCb && askCb(); break;
    case 'askNo': $('#ask').classList.remove('open'); break;

    case 'tutNext': if (tIdx === document.querySelectorAll('.slide').length - 1) tutFinish(true); else tutGo(tIdx + 1); break;
    case 'tutSkip': tutFinish(false); break;
  }
});

/* ================= Init ================= */
save();
render();
if (!S.onboarded) openTutorial();
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); calSel = lastDay; render(); } else if (cur === 'home' && !$('#sheet').classList.contains('open')) renderHome(); checkRemind(); }, 60000);
setTimeout(checkRemind, 1500);
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); calSel = lastDay; render(); } });
</script>
</body>
</html>
